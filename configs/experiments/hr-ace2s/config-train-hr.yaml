# ACE2S (stochastic NoiseConditionedSFNO trained with EnsembleLoss) for the
# atmosphere of the E3SMv3 HR F2010 run v3.HR.F2010.aigo.PD.y1 at 0.25 deg
# (720x1440 Gaussian grid): 2.1 B parameters with full harmonics.
#
# Trained with the spatial backend, 4x1 tiles per node and data parallelism
# across nodes (scripts/train.sh). train_loader.batch_size is split over the
# data-parallel replicas (world / 4), one sample per replica, so batch_size =
# number of replicas; scripts/sbatch-train-hr.sh sets it. Keep the node count
# fixed for a run. The inline inference ICs must be divisible by the number
# of replicas, with at most 2 per replica on 40 GB cards.
#
# Splits (perpetual-2010 forcing, so they only need to be disjoint in time):
# train 0001-02 .. 0013-12, validation 0014, test 0015-01 .. 0016-12.
experiment_dir: OVERRIDE_ME
save_checkpoint: true
save_per_epoch_diagnostics: false
seed: 1
validate_using_ema: true
ema:
  decay: 0.999
max_epochs: 20
checkpoint_save_epochs:
  step: 1
ema_checkpoint_save_epochs:
  step: 1
inference:
  # 90 days from 8 initial conditions in the training period, every 2 epochs.
  - name: inference
    weight: 1.0
    epochs:
      start: 1
      step: 2
    n_forward_steps: 360
    forward_steps_in_memory: 20
    loader:
      start_indices:
        times:
        - '0002-01-01T00:00:00'
        - '0003-07-01T00:00:00'
        - '0005-01-01T00:00:00'
        - '0006-07-01T00:00:00'
        - '0008-01-01T00:00:00'
        - '0009-07-01T00:00:00'
        - '0011-01-01T00:00:00'
        - '0012-07-01T00:00:00'
      dataset: &dataset
        data_path: /pscratch/sd/m/mahf708/hr-data/v3.HR.F2010.aigo.PD.y1/eam.h0
        file_pattern: &file_pattern v3.HR.F2010.aigo.PD.y1.eam.h0.*.nc
        # one pread per field instead of netCDF-C's 8 KiB reads
        engine: &engine cdf5
        # precipitation is renamed and scaled from m/s to kg/m2/s
        rename: &rename
          PRECT: surface_precipitation_rate
          PRECST: frozen_precipitation_rate
        # the hybrid coefficients ak_k are dimensionless, scaled by P0
        reference_pressure_name: &reference_pressure_name P0
        overwrite: &overwrite
          multiply_scalar:
            surface_precipitation_rate: 1000.0
            frozen_precipitation_rate: 1000.0
      num_data_workers: 2
logging:
  log_to_screen: true
  log_to_wandb: false
  log_to_file: true
  project: ACE2S-E3SMv3-HR
  entity: e3sm-aig
train_loader:
  batch_size: 8  # = number of replicas, set by scripts/sbatch-train-hr.sh
  num_data_workers: 4
  prefetch_factor: 2
  time_buffer: 4
  time_buffer_pool_size: 1
  dataset:
    data_path: /pscratch/sd/m/mahf708/hr-data/v3.HR.F2010.aigo.PD.y1/eam.h0
    file_pattern: *file_pattern
    engine: *engine
    rename: *rename
    reference_pressure_name: *reference_pressure_name
    overwrite: *overwrite
    subset:
      start_time: '0001-02-01T00:00:00'
      stop_time: '0013-12-31T18:00:00'
validation:
  loader:
    batch_size: 8
    num_data_workers: 4
    prefetch_factor: 2
    dataset:
      data_path: /pscratch/sd/m/mahf708/hr-data/v3.HR.F2010.aigo.PD.y1/eam.h0
      file_pattern: *file_pattern
      engine: *engine
      rename: *rename
      reference_pressure_name: *reference_pressure_name
      overwrite: *overwrite
      subset:
        start_time: '0014-01-01T00:00:00'
        stop_time: '0014-12-31T18:00:00'
        step: 4
  # Image metrics off: at 720x1440 they take minutes per validation. The
  # scalar metrics are unaffected.
  aggregator:
    snapshot:
      enabled: false
    mean_map:
      enabled: false
    ensemble_denorm:
      log_mean_maps: false
optimization:
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: FusedAdam
  # ZeRO-1 over each spatial group. With shard_spatial_parameters it only
  # partitions the replicated parameters and saves ~40 MB per GPU.
  shard_optimizer_state: false
  kwargs:
    weight_decay: 0.01
stepper_training:
  n_ensemble: 2
  n_forward_steps: 1
  optimize_last_step_only: true
  loss:
    type: EnsembleLoss
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
stepper:
  step:
    type: single_module
    config:
      residual_prediction: false
      builder:
        type: NoiseConditionedSFNO
        config:
          embed_dim: 384
          checkpointing: 3
          noise_embed_dim: 32
          noise_type: isotropic
          filter_type: linear
          use_mlp: true
          num_layers: 8
          affine_norms: true
          # Fraction of the grid's 720 spherical-harmonic degrees kept by the
          # spectral filters. 1.0 (full harmonics) is the validated setting.
          # 0.5 keeps l <= 360: 1.25 B instead of 2.1 B params and ~40% less
          # step time, at lower spectral resolution in the filters.
          hard_thresholding_fraction: 1.0
          # Each spatial rank stores only its l-slice of the spectral weights
          # and its tile of pos_embed; same numerics, and checkpoints keep the
          # full (unsharded) format. Required to fit 40 GB cards.
          shard_spatial_parameters: true
          # Per-mode channel mixing of the spectral filters on TF32 tensor
          # cores (the Legendre transforms stay fp32): -5% step time, losses
          # within run-to-run noise.
          tf32_channel_mixing: true
          # Blocks whose spectral filter is kept out of activation
          # checkpointing (saves the filter's recompute and all-to-alls at
          # +~1.6 GB per block at 4x1). 0 on 40 GB cards; 8 on 80 GB cards
          # (4x1: 3.40 -> 2.60 s/step, 47 GiB) or for 8x1 layouts.
          uncheckpointed_filter_blocks: 0
      normalization:
        network:
          global_means_path: /pscratch/sd/m/mahf708/hr-data/stats-2026-10-19/train-stride4/centering.nc
          global_stds_path: /pscratch/sd/m/mahf708/hr-data/stats-2026-10-19/train-stride4/scaling-full-field.nc
        residual:
          global_means_path: /pscratch/sd/m/mahf708/hr-data/stats-2026-10-19/train-stride4/centering.nc
          global_stds_path: /pscratch/sd/m/mahf708/hr-data/stats-2026-10-19/train-stride4/scaling-residual.nc
      ocean:
        surface_temperature_name: TS
        ocean_fraction_name: OCNFRAC
        interpolate: true
      corrector:
        conserve_dry_air: true
        moisture_budget_correction: advection_and_precipitation
        force_positive_names:
        - STW_0
        - STW_1
        - STW_2
        - STW_3
        - STW_4
        - STW_5
        - STW_6
        - STW_7
        - surface_precipitation_rate
        - frozen_precipitation_rate
        - FLUS
        - FLUT
        - FLDS
        - FSNS
        - FSUTOA
      next_step_forcing_names:
      - SOLIN
      in_names: &in_names
      - LANDFRAC
      - OCNFRAC
      - ICEFRAC
      - PHIS
      - SOLIN
      - PS
      - TS
      - T_0
      - T_1
      - T_2
      - T_3
      - T_4
      - T_5
      - T_6
      - T_7
      - STW_0
      - STW_1
      - STW_2
      - STW_3
      - STW_4
      - STW_5
      - STW_6
      - STW_7
      - U_0
      - U_1
