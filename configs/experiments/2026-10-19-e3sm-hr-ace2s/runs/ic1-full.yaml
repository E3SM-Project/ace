# GENERATED: production config, full harmonics, 1 inline-inference IC(s)
checkpoint_save_epochs:
  step: 1
ema:
  decay: 0.999
ema_checkpoint_save_epochs:
  step: 1
experiment_dir: OVERRIDE_ME
inference:
- epochs:
    start: 1
    step: 2
  forward_steps_in_memory: 20
  loader:
    dataset:
      data_path: /pscratch/sd/m/mahf708/hr-data/v3.HR.F2010.aigo.PD.y1/eam.h0
      engine: cdf5
      file_pattern: v3.HR.F2010.aigo.PD.y1.eam.h0.*.nc
      overwrite: &id001
        multiply_scalar:
          frozen_precipitation_rate: 1000.0
          surface_precipitation_rate: 1000.0
      reference_pressure_name: P0
      rename: &id002
        PRECST: frozen_precipitation_rate
        PRECT: surface_precipitation_rate
    num_data_workers: 2
    start_indices:
      times:
      - '0002-01-01T00:00:00'
  n_forward_steps: 360
  name: inference
  weight: 1.0
logging:
  entity: e3sm-aig
  log_to_file: true
  log_to_screen: true
  log_to_wandb: false
  project: ACE2S-E3SMv3-HR
max_epochs: 20
optimization:
  enable_automatic_mixed_precision: false
  kwargs:
    weight_decay: 0.01
  lr: 0.0001
  optimizer_type: FusedAdam
  shard_optimizer_state: true
save_checkpoint: true
save_per_epoch_diagnostics: false
seed: 1
stepper:
  step:
    config:
      builder:
        config:
          affine_norms: true
          checkpointing: 3
          embed_dim: 384
          filter_type: linear
          hard_thresholding_fraction: 1.0
          noise_embed_dim: 32
          noise_type: isotropic
          num_layers: 8
          shard_spatial_parameters: true
          use_mlp: true
        type: NoiseConditionedSFNO
      corrector:
        conserve_dry_air: true
        force_positive_names:
        - STW_0
        - STW_1
        - STW_2
        - STW_3
        - STW_4
        - STW_5
        - STW_6
        - STW_7
        - surface_precipitation_rate
        - frozen_precipitation_rate
        - FLUS
        - FLUT
        - FLDS
        - FSNS
        - FSUTOA
        moisture_budget_correction: advection_and_precipitation
      in_names:
      - LANDFRAC
      - OCNFRAC
      - ICEFRAC
      - PHIS
      - SOLIN
      - PS
      - TS
      - T_0
      - T_1
      - T_2
      - T_3
      - T_4
      - T_5
      - T_6
      - T_7
      - STW_0
      - STW_1
      - STW_2
      - STW_3
      - STW_4
      - STW_5
      - STW_6
      - STW_7
      - U_0
      - U_1
      - U_2
      - U_3
      - U_4
      - U_5
      - U_6
      - U_7
      - V_0
      - V_1
      - V_2
      - V_3
      - V_4
      - V_5
      - V_6
      - V_7
      - Qat2m
      - Uat10m
      - Vat10m
      - Tat2m
      next_step_forcing_names:
      - SOLIN
      normalization:
        network:
          global_means_path: /pscratch/sd/m/mahf708/hr-data/stats-2026-10-19/train-stride4/centering.nc
          global_stds_path: /pscratch/sd/m/mahf708/hr-data/stats-2026-10-19/train-stride4/scaling-full-field.nc
        residual:
          global_means_path: /pscratch/sd/m/mahf708/hr-data/stats-2026-10-19/train-stride4/centering.nc
          global_stds_path: /pscratch/sd/m/mahf708/hr-data/stats-2026-10-19/train-stride4/scaling-residual.nc
      ocean:
        interpolate: true
        ocean_fraction_name: OCNFRAC
        surface_temperature_name: TS
      out_names:
      - PS
      - TS
      - T_0
      - T_1
      - T_2
      - T_3
      - T_4
      - T_5
      - T_6
      - T_7
      - STW_0
      - STW_1
      - STW_2
      - STW_3
      - STW_4
      - STW_5
      - STW_6
      - STW_7
      - U_0
      - U_1
      - U_2
      - U_3
      - U_4
      - U_5
      - U_6
      - U_7
      - V_0
      - V_1
      - V_2
      - V_3
      - V_4
      - V_5
      - V_6
      - V_7
      - LHFLX
      - SHFLX
      - surface_precipitation_rate
      - frozen_precipitation_rate
      - FLUS
      - FLUT
      - FLDS
      - FSNS
      - FSUTOA
      - DTENDTTW
      - TAUX
      - TAUY
      - Qat2m
      - Uat10m
      - Vat10m
      - Tat2m
      residual_prediction: false
    type: single_module
stepper_training:
  loss:
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
    type: EnsembleLoss
  n_ensemble: 2
  n_forward_steps: 1
  optimize_last_step_only: true
train_loader:
  batch_size: 8
  dataset:
    data_path: /pscratch/sd/m/mahf708/hr-data/v3.HR.F2010.aigo.PD.y1/eam.h0
    engine: cdf5
    file_pattern: v3.HR.F2010.aigo.PD.y1.eam.h0.*.nc
    overwrite: *id001
    reference_pressure_name: P0
    rename: *id002
    subset:
      start_time: '0001-02-01T00:00:00'
      stop_time: '0013-12-31T18:00:00'
  num_data_workers: 4
  prefetch_factor: 2
  time_buffer: 4
  time_buffer_pool_size: 1
validate_using_ema: true
validation:
  aggregator:
    ensemble_denorm:
      log_mean_maps: false
    mean_map:
      enabled: false
    snapshot:
      enabled: false
  loader:
    batch_size: 8
    dataset:
      data_path: /pscratch/sd/m/mahf708/hr-data/v3.HR.F2010.aigo.PD.y1/eam.h0
      engine: cdf5
      file_pattern: v3.HR.F2010.aigo.PD.y1.eam.h0.*.nc
      overwrite: *id001
      reference_pressure_name: P0
      rename: *id002
      subset:
        start_time: '0014-01-01T00:00:00'
        step: 4
        stop_time: '0014-12-31T18:00:00'
    num_data_workers: 4
    prefetch_factor: 2
