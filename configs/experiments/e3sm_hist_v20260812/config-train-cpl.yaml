stepper_training:
  n_coupled_steps: 4
  n_ensemble: 2
  ocean:
    loss_weight: 1.0
    optimize_last_step_only: false
    n_steps:
      outcomes:
      - steps: 0
        probability: 0.1
      - steps: 1
        probability: 0.3
      - steps: 2
        probability: 0.3
      - steps: 4
        probability: 0.3
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
  atmosphere:
    loss_weight: 1.0
    optimize_last_step_only: true
    n_steps:
      outcomes:
      - steps: 0
        probability: 0.025
      - steps: 1
        probability: 0.275
      - steps: 2
        probability: 0.275
      - steps: 4
        probability: 0.275
      - steps: 21
        probability: 0.1
      - steps: 41
        probability: 0.05
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
