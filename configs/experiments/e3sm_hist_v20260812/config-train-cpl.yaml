              - 1
              - 2
              - 4
              - 8
              n_layers:
              - 1
              - 1
              - 1
              - 1
              norm: instance
              upscale_factor: 2
              checkpoint_strategy: all
          normalization:
            network:
              global_means_path: /pscratch/sd/m/mahf708/e3sm-hist-inputs/stats-2026-08-13/train-only/ocean/centering.nc
