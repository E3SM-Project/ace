optimization:
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: FusedAdam
  use_gradient_accumulation: true
  kwargs:
    weight_decay: 0.01
stepper_training:
  n_coupled_steps: 4
  n_ensemble: 2
  ocean:
    loss_weight: 1.0
    optimize_last_step_only: false
    n_steps:
      outcomes:
      - steps: 0
        probability: 0.1
      - steps: 1
        probability: 0.3
      - steps: 2
        probability: 0.3
      - steps: 4
        probability: 0.3
    loss:
      type: EnsembleLoss
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
  atmosphere:
    loss_weight: 1.0
    optimize_last_step_only: true
    n_steps:
      outcomes:
      - steps: 0
        probability: 0.025
      - steps: 1
        probability: 0.275
      - steps: 2
        probability: 0.275
      - steps: 4
        probability: 0.275
      - steps: 21
        probability: 0.1
      - steps: 41
        probability: 0.05
    loss:
      type: EnsembleLoss
      weights:
        T_0: 0.5
        T_1: 0.5
        U_0: 0.5
        V_0: 0.5
        STW_0: 0.25
        STW_1: 0.25
        STW_2: 0.5
        surface_precipitation_rate: 2
        FLDS: 2
        FLUS: 5
        FSNS: 2
        FSUTOA: 2
        DTENDTTW: 0.5
        PS: 3
      kwargs:
        crps_weight: 0.9
        energy_score_weight: 0.1
