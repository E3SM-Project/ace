          mask_and_scale: true
          rename:
            windStressZonal: TAUX
            windStressMeridional: TAUY
            shortWaveHeatFlux: FSNS
            longWaveHeatFluxDown: FLDS
            longWaveHeatFluxUp: FLUS
            latentHeatFlux: LHFLX
            sensibleHeatFlux: SHFLX
            snowFlux: frozen_precipitation_rate
