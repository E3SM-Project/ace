        merge:
        - data_path: /global/cfs/cdirs/e3smdata/simulations/v3.LR.historical_0101.aigo/run
          file_pattern: v3.LR.historical_0101.aigo.mpaso.hist.am.fmeDepthCoarsening5D.*.remapped.nc
