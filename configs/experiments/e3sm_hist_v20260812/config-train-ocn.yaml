          stop_time: '1995-01-01'
      - data_path: /global/cfs/cdirs/e3smdata/simulations/v3.LR.historical_0101.aigo/run
        file_pattern: v3.LR.historical_0101.aigo.mpaso.hist.am.fmeDerivedFields5D.*.remapped.nc
        mask_and_scale: true
        rename: *id001
        overwrite:
          multiply_scalar: *id002
          add_scalar:
            sst: 273.15
        combine:
          surface_precipitation_rate:
            rainFlux: 1.0
            frozen_precipitation_rate: 1.0
        subset:
          start_time: '1990-01-06'
          stop_time: '1995-01-01'
      - data_path: /global/cfs/cdirs/e3smdata/simulations/v3.LR.historical_0101.aigo/run
        file_pattern: v3.LR.historical_0101.aigo.mpassi.hist.am.fmeSeaiceDerivedFields5D.*.remapped.nc
        mask_and_scale: true
        rename:
          iceAreaTotal: ocean_sea_ice_fraction
        subset:
          start_time: '1990-01-06'
          stop_time: '1995-01-01'
      - data_path: /global/cfs/cdirs/e3smdata/emulator/SamudrACE-E3SMv3/historical/landfrac5d
        file_pattern: landfrac5d.*.nc
        subset:
          start_time: '1990-01-06'
          stop_time: '1995-01-01'
  # 1D logs only: the one-step aggregator's two image metrics are off.
  aggregator:
    snapshot:
      enabled: false
    mean_map:
      enabled: false
    # The validation ensemble emits crps / ssr_bias / ensemble_mean_rmse mean
    # maps for every channel -- 174 PNGs per atmosphere epoch, a third of the
    # whole upload. The scalars are what the campaign reads.
    ensemble_denorm:
      log_mean_maps: false
optimization:
  use_gradient_accumulation: true
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: AdamW
  kwargs:
    fused: true
    weight_decay: 0.01
stepper_training:
  n_forward_steps: 4
  loss:
    type: MSE
stepper:
  input_masking:
    mask_value: 0
    fill_value: 0
    exclude_names_and_prefixes:
    - LANDFRAC
  step:
    type: single_module
    config:
      builder:
        type: Samudra
        config:
          ch_width:
          - 280
          - 380
          - 480
          - 520
