# Samudra ocean BASELINE for the 2026-08-31 hackathon (run E11).
#
# This file is the campaign baseline, not a maximal config. It is exactly
#
#     E11 = aug26.ocn.A0_B16_C0_O5_W0_X0.S01
#
# in the naming scheme on the hackathon page: 5-daily ocean stepping, batch 16,
# equal (unweighted MSE) loss, no AMP. E12/E13/E14 are generated from this file
# by make_ablation_config.py, which only reweights the loss.
#
# Sizing. `batch_size` is global and split across ranks. This config runs at
# local batch 2, so the rank count is batch_size / 2:
#
#     B08 ->  4 ranks = 1 node
#     B16 ->  8 ranks = 2 nodes   <- the baseline
#     B32 -> 16 ranks = 4 nodes
#
#
# The starts are on a 5-year grid except for 1977 and 2027, which are where 1980
# and 2030 used to be. This block is weight 1.0, so it *selects the checkpoint*,
# and the thing that has to be in-sample is the whole 12-year trajectory, not
# just its first timestep: 1980 ran to 1992 (into the 1990-95 validation split)
# and 2030 to 2042 (into the held-out test period). 1977 ends 1989 and 2027 ends
# 2039, both inside their training subsets. check_campaign.py enforces this.
# The 16 inference initial conditions divide 4, 8 and 16, so no IC rewrite is
# needed for any ocean variant.
#
# Per the "FOR NASER" box on the hackathon page: checkpoints every epoch, wandb
# 2D image metrics off, 1D logs kept. The embed_dim / noise_embed_dim items in
# that box are atmosphere-only (Samudra has neither), and the ocean loss is
# already unweighted MSE, which is the "equal loss weighting" the box asks for.
#
# `12yr_test` fires on range(max_epochs + 1)[start::step], so `start` has to be
# chosen against max_epochs or the final epoch is never scored. With
# max_epochs 150 and step 5, start 0 fires on 0, 5, ... 150. make_ablation_config.py
# recomputes it whenever it changes max_epochs.
#
# Launch through sbatch-scripts/run-train.sh, and during the hackathon window
# export RESERVATION=_CAP_aigs_hist. See README.md and EXPERIMENTS.md.
# Placeholder. Every launch path overrides it: sbatch-train-*.sh sets
# experiment_dir=$CAMPAIGN_ROOT/$RUNID via FME_OVERRIDE_ARGS, and the
# ad-hoc invocations above pass --override themselves. Naming a real
# directory here would name one person's scratch in all 35 generated
# configs, which is how runs/ stopped being shareable the first time.
experiment_dir: OVERRIDE_ME
save_checkpoint: true
# Every aggregator's full fields land in experiment_dir as netCDF each
# epoch. This is the other half of the upload-budget trade below: the
# maps are kept, they are just kept on disk instead of in W&B.
save_per_epoch_diagnostics: true
seed: 1
validate_using_ema: true
ema:
  decay: 0.999
max_epochs: 150
# Every epoch: training checkpoint (with optimizer state) and EMA checkpoint
# (weights only). See EXPERIMENTS.md "Checkpoint storage".
checkpoint_save_epochs:
  step: 1
ema_checkpoint_save_epochs:
  step: 1
inference:
- name: inference
  weight: 1.0
  n_forward_steps: 876
  forward_steps_in_memory: 20
  loader:
    start_indices:
      times:
      - '1940-01-06T00:00:00'
      - '1945-01-06T00:00:00'
      - '1950-01-06T00:00:00'
      - '1955-01-06T00:00:00'
      - '1960-01-06T00:00:00'
      - '1965-01-06T00:00:00'
      - '1970-01-06T00:00:00'
      - '1975-01-06T00:00:00'
      - '1977-01-06T00:00:00'
      - '2000-01-06T00:00:00'
      - '2005-01-06T00:00:00'
      - '2010-01-06T00:00:00'
      - '2015-01-06T00:00:00'
      - '2020-01-06T00:00:00'
      - '2025-01-06T00:00:00'
      - '2027-01-06T00:00:00'
    dataset:
      merge:
      - data_path: /global/cfs/cdirs/e3smdata/simulations/v3.LR.historical_0101.aigo/run
        file_pattern: v3.LR.historical_0101.aigo.mpaso.hist.am.fmeDepthCoarsening5D.*.remapped.nc
        mask_and_scale: true
      - data_path: /global/cfs/cdirs/e3smdata/simulations/v3.LR.historical_0101.aigo/run
        file_pattern: v3.LR.historical_0101.aigo.mpaso.hist.am.fmeDerivedFields5D.*.remapped.nc
        mask_and_scale: true
        rename: &id001
          windStressZonal: TAUX
          windStressMeridional: TAUY
          shortWaveHeatFlux: FSNS
          longWaveHeatFluxDown: FLDS
          longWaveHeatFluxUp: FLUS
          latentHeatFlux: LHFLX
          sensibleHeatFlux: SHFLX
          snowFlux: frozen_precipitation_rate
        overwrite:
          multiply_scalar: &id002
            TAUX: -1.0
            TAUY: -1.0
            FLUS: -1.0
            LHFLX: -1.0
            SHFLX: -1.0
          add_scalar:
            sst: 273.15
        combine:
          surface_precipitation_rate:
            rainFlux: 1.0
            frozen_precipitation_rate: 1.0
      - data_path: /global/cfs/cdirs/e3smdata/simulations/v3.LR.historical_0101.aigo/run
        file_pattern: v3.LR.historical_0101.aigo.mpassi.hist.am.fmeSeaiceDerivedFields5D.*.remapped.nc
        mask_and_scale: true
        rename:
          iceAreaTotal: ocean_sea_ice_fraction
      - data_path: /global/cfs/cdirs/e3smdata/emulator/SamudrACE-E3SMv3/historical/landfrac5d
        file_pattern: landfrac5d.*.nc
    num_data_workers: 8
  # 1D logs kept and unrestricted. time_mean reports rmse and bias for every
  # channel; only the per-channel images are narrowed -- see WHAT GETS PLOTTED.
  aggregator: &inference_aggregator_1d
     # 1D distribution plots, on the same channel list as the maps below.
    # A YAML anchor must be defined before use and this is the first use.
    histogram:
      enabled: true
      variables: &plot_vars [sst, ssh, ocean_sea_ice_fraction, iceVolumeTotal, temperatureCoarsened_0,
      temperatureCoarsened_1, temperatureCoarsened_2,
      temperatureCoarsened_9, temperatureCoarsened_17,
      temperatureCoarsened_18, salinityCoarsened_0, salinityCoarsened_1,
      salinityCoarsened_2, salinityCoarsened_9, salinityCoarsened_17,
      salinityCoarsened_18, velocityZonalCoarsened_0,
      velocityZonalCoarsened_1, velocityZonalCoarsened_2,
      velocityZonalCoarsened_9, velocityZonalCoarsened_17,
      velocityZonalCoarsened_18, velocityMeridionalCoarsened_0,
      velocityMeridionalCoarsened_1, velocityMeridionalCoarsened_2,
      velocityMeridionalCoarsened_9, velocityMeridionalCoarsened_17,
      velocityMeridionalCoarsened_18]
    zonal_mean:
      enabled: false
    video:
      enabled: false
    trend:
      enabled: false
    seasonal:
      enabled: false
    near_zero_fraction:
      enabled: false
    enso_coefficient:
      enabled: false
    step_diagnostics:
      correction_scalars: true
      correction_maps: false
    # WHAT GETS PLOTTED. One PNG per channel per map metric per block per
    # epoch is what fills a 100 GB W&B account -- measured 2026-08-30 at 506
    # images per atmosphere epoch and 484 per ocean epoch. Plotting nearly all
    # of it is affordable; the interior levels are the part not worth the
    # bytes, so they are the only thing dropped: index 0 is the surface, so this keeps the top three levels, one mid-depth
    # reference and the two deepest -- the last is where W4's zeroed channel
    # lives. 28 of 80 channels.
    #
    # `plot_variables` gates IMAGES ONLY. rmse/<var>, bias/<var> and
    # rmse/channel_mean are still emitted for EVERY channel, so no comparison
    # loses a number. Everything is on disk regardless --
    # `save_per_epoch_diagnostics: true` writes each aggregator's full fields
    # to experiment_dir as netCDF every epoch.
    time_mean_denorm:
      plot_variables: *plot_vars
    time_mean_norm:
      # target must be written out: dacite builds this field from the yaml
      # alone, so the dataclass default ("denorm") wins over the
      # default_factory and the config fails post-init with a UnionMatchError
      # on `inference` that names neither the field nor the reason.
      target: norm
      plot_variables: *plot_vars
    power_spectrum:
      plot_variables: *plot_vars
    # Needs >80 years of rollout; the scored one is 12, so this can never
    # build -- it only ever logs "metric not supported" four times an epoch.
    ipo_index:
      enabled: false
- name: 12yr_test
  weight: 0.0
  epochs:
    start: 0
    step: 5
  n_forward_steps: 876
  forward_steps_in_memory: 20
  loader:
    start_indices:
      times:
      - '2040-01-06T00:00:00'
      - '2040-07-05T00:00:00'
      - '2041-01-06T00:00:00'
      - '2041-07-05T00:00:00'
      - '2042-01-06T00:00:00'
      - '2042-07-05T00:00:00'
      - '2043-01-06T00:00:00'
      - '2043-07-05T00:00:00'
      - '2044-01-06T00:00:00'
      - '2044-07-05T00:00:00'
      - '2045-01-06T00:00:00'
      - '2045-07-05T00:00:00'
      - '2046-01-06T00:00:00'
      - '2046-07-05T00:00:00'
      - '2047-01-06T00:00:00'
      - '2047-07-05T00:00:00'
    dataset:
      merge:
      - data_path: /global/cfs/cdirs/e3smdata/simulations/v3.LR.historical_0101.aigo/run
        file_pattern: v3.LR.historical_0101.aigo.mpaso.hist.am.fmeDepthCoarsening5D.*.remapped.nc
        mask_and_scale: true
      - data_path: /global/cfs/cdirs/e3smdata/simulations/v3.LR.historical_0101.aigo/run
        file_pattern: v3.LR.historical_0101.aigo.mpaso.hist.am.fmeDerivedFields5D.*.remapped.nc
        mask_and_scale: true
        rename: *id001
        overwrite:
          multiply_scalar: *id002
          add_scalar:
            sst: 273.15
        combine:
          surface_precipitation_rate:
            rainFlux: 1.0
            frozen_precipitation_rate: 1.0
      - data_path: /global/cfs/cdirs/e3smdata/simulations/v3.LR.historical_0101.aigo/run
        file_pattern: v3.LR.historical_0101.aigo.mpassi.hist.am.fmeSeaiceDerivedFields5D.*.remapped.nc
        mask_and_scale: true
        rename:
          iceAreaTotal: ocean_sea_ice_fraction
      - data_path: /global/cfs/cdirs/e3smdata/emulator/SamudrACE-E3SMv3/historical/landfrac5d
        file_pattern: landfrac5d.*.nc
    num_data_workers: 8
  aggregator: *inference_aggregator_1d
# wandb. Both realms go to ONE project so atmosphere and ocean runs sit in the
# same workspace and can be filtered by tag rather than compared across projects.
# `entity` is the team, not the account: `wandb login` prints
# "Currently logged in as: <username> (<entity>)", so e3sm-ai is the account and
# e3sm-aig is the entity.
#
# Run identity is NOT set here -- WANDB_NAME, WANDB_RUN_GROUP, WANDB_JOB_TYPE,
# WANDB_TAGS and WANDB_NOTES are read straight from the environment by the wandb
# library. make_ablation_config.py writes them into runs/<runid>.env and
# run-train.sh exports them, so an ad-hoc launch of this file lands unnamed.
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: SamudrACE-E3SMv3
  entity: e3sm-aig
train_loader:
  # Data loading. The atmosphere baseline was MEASURED 2026-08-29 on 4 nodes /
  # 16 ranks: `num_data_workers: 2, prefetch_factor: 1` ran at 3.16 s/batch
  # effective against a 0.90 s/batch compute-bound rate, and 8/4 measured
  # 0.925 s/batch. The OCEAN WAS THEN MEASURED THE SAME WAY and is starved
  # worse: 2 nodes / 8 ranks, 24.36 s/step at 2/1 versus 3.10 s/step at 8/4 --
  # a 7.9x speedup, and that was under contention from a concurrent job, so it
  # is a lower bound. It reads a four-way merge (DepthCoarsening5D,
  # DerivedFields5D, SeaiceDerivedFields5D, landfrac5d), which is why.
  # This decides max_epochs: a 411-step epoch is 2.78 h at 2/1, so 150 epochs
  # was a 417 h run against a 126 h window; at 8/4 it is 0.35 h and 53 h.
  # The ocean sets no `time_buffer`, so `time_buffer_pool_size` does not apply
  # (it is rejected when time_buffer is 0).
  # See EXPERIMENTS.md "Measurements".
  batch_size: 16
  num_data_workers: 8
  prefetch_factor: 4
  dataset:
    merge:
    - concat:
      - data_path: /global/cfs/cdirs/e3smdata/simulations/v3.LR.historical_0101.aigo/run
        file_pattern: v3.LR.historical_0101.aigo.mpaso.hist.am.fmeDepthCoarsening5D.*.remapped.nc
        mask_and_scale: true
        subset:
          start_time: '1940-01-06'
          stop_time: '1990-01-01'
      - data_path: /global/cfs/cdirs/e3smdata/simulations/v3.LR.historical_0101.aigo/run
        file_pattern: v3.LR.historical_0101.aigo.mpaso.hist.am.fmeDepthCoarsening5D.*.remapped.nc
        mask_and_scale: true
        subset:
          start_time: '2000-01-06'
          stop_time: '2040-01-01'
    - concat:
      - data_path: /global/cfs/cdirs/e3smdata/simulations/v3.LR.historical_0101.aigo/run
        file_pattern: v3.LR.historical_0101.aigo.mpaso.hist.am.fmeDerivedFields5D.*.remapped.nc
        mask_and_scale: true
        rename: *id001
        overwrite: &id003
          multiply_scalar: *id002
          add_scalar:
            sst: 273.15
        combine: &id004
          surface_precipitation_rate:
            rainFlux: 1.0
            frozen_precipitation_rate: 1.0
        subset:
          start_time: '1940-01-06'
          stop_time: '1990-01-01'
      - data_path: /global/cfs/cdirs/e3smdata/simulations/v3.LR.historical_0101.aigo/run
        file_pattern: v3.LR.historical_0101.aigo.mpaso.hist.am.fmeDerivedFields5D.*.remapped.nc
        mask_and_scale: true
        rename: *id001
        overwrite: *id003
        combine: *id004
        subset:
          start_time: '2000-01-06'
          stop_time: '2040-01-01'
    - concat:
      - data_path: /global/cfs/cdirs/e3smdata/simulations/v3.LR.historical_0101.aigo/run
        file_pattern: v3.LR.historical_0101.aigo.mpassi.hist.am.fmeSeaiceDerivedFields5D.*.remapped.nc
        mask_and_scale: true
        rename: &id005
          iceAreaTotal: ocean_sea_ice_fraction
        subset:
          start_time: '1940-01-06'
          stop_time: '1990-01-01'
      - data_path: /global/cfs/cdirs/e3smdata/simulations/v3.LR.historical_0101.aigo/run
        file_pattern: v3.LR.historical_0101.aigo.mpassi.hist.am.fmeSeaiceDerivedFields5D.*.remapped.nc
        mask_and_scale: true
        rename: *id005
        subset:
          start_time: '2000-01-06'
          stop_time: '2040-01-01'
    - concat:
      - data_path: /global/cfs/cdirs/e3smdata/emulator/SamudrACE-E3SMv3/historical/landfrac5d
        file_pattern: landfrac5d.*.nc
        subset:
          start_time: '1940-01-06'
          stop_time: '1990-01-01'
      - data_path: /global/cfs/cdirs/e3smdata/emulator/SamudrACE-E3SMv3/historical/landfrac5d
        file_pattern: landfrac5d.*.nc
        subset:
          start_time: '2000-01-06'
          stop_time: '2040-01-01'
validation:
