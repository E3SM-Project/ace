<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Land Data Explorer</title>
<script src="lib/plotly.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<style>
:root {
  color-scheme: light;
  --page: #f4f3f0;
  --surface-1: #fcfcfb;
  --surface-2: #efeeea;
  --border: #dddcd6;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #8a8984;
  --accent: #2a78d6;
  --grid: #e6e5e0;
  --coast: rgba(20, 20, 20, 0.75);
  --div-neg: #1c5cab; --div-mid: #f0efec; --div-pos: #c0302f;
  --seq-0: #f1f5fb; --seq-1: #b9d0ee; --seq-2: #6f9fdc; --seq-3: #2a6bc0; --seq-4: #0f3a75;
  --missing: #bdbcb6;
  --cov-ocean: #e3e8ee; --cov-land: #7fb685; --cov-some: #eda100; --cov-all: #c0302f;
  --st-ok: #0f7a45; --st-info: #52514e; --st-warn: #9a5b00; --st-bad: #b42324;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #111110; --surface-1: #1a1a19; --surface-2: #242422; --border: #34342f;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8a8984;
    --accent: #3987e5; --grid: #2c2c29; --coast: rgba(255, 255, 255, 0.7);
    --div-neg: #3987e5; --div-mid: #383835; --div-pos: #e66767; --missing: #55554f;
    --cov-ocean: #1f2830; --cov-land: #4f8a5a; --cov-some: #c98500; --cov-all: #e66767;
    --seq-0: #1c2633; --seq-1: #23466f; --seq-2: #2f6bb0; --seq-3: #5c9be6; --seq-4: #b5d3fa;
    --st-ok: #3fc58a; --st-info: #c3c2b7; --st-warn: #e0a440; --st-bad: #f07c7c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #111110; --surface-1: #1a1a19; --surface-2: #242422; --border: #34342f;
  --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8a8984;
  --accent: #3987e5; --grid: #2c2c29; --coast: rgba(255, 255, 255, 0.7);
  --div-neg: #3987e5; --div-mid: #383835; --div-pos: #e66767; --missing: #55554f;
  --cov-ocean: #1f2830; --cov-land: #4f8a5a; --cov-some: #c98500; --cov-all: #e66767;
  --seq-0: #1c2633; --seq-1: #23466f; --seq-2: #2f6bb0; --seq-3: #5c9be6; --seq-4: #b5d3fa;
  --st-ok: #3fc58a; --st-info: #c3c2b7; --st-warn: #e0a440; --st-bad: #f07c7c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--text-primary);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
header {
  display: flex; align-items: baseline; gap: 16px; padding: 12px 20px;
  border-bottom: 1px solid var(--border); background: var(--surface-1);
}
header h1 { font-size: 17px; margin: 0; font-weight: 600; }
header .sub { color: var(--text-secondary); font-size: 13px; }
header .spacer { flex: 1; }
button, select, input[type=number] {
  font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px;
}
button { cursor: pointer; }
button:hover { background: var(--surface-2); }
.layout { display: grid; grid-template-columns: 270px 1fr; min-height: calc(100vh - 50px);
  background: linear-gradient(90deg, var(--surface-1) 269px, var(--border) 269px 270px, transparent 270px); }
aside {
  border-right: 1px solid var(--border); background: var(--surface-1);
  padding: 14px 16px; overflow-y: auto; max-height: calc(100vh - 50px); position: sticky; top: 0;
}
aside h2 {
  font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--text-secondary); margin: 16px 0 8px; display: flex; justify-content: space-between;
}
aside h2:first-child { margin-top: 0; }
aside h2 a { text-transform: none; letter-spacing: 0; color: var(--accent); cursor: pointer; font-weight: 400; }
aside select { width: 100%; }
.check { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
.check input { margin: 0; }
.lineswatch { flex: none; display: block; }
.check .meta { color: var(--text-muted); font-size: 11px; margin-left: auto; white-space: nowrap; }
details.group { margin: 2px 0; }
details.group summary { cursor: pointer; color: var(--text-secondary); font-size: 13px; padding: 3px 0; user-select: none; }
details.group summary .n { color: var(--text-muted); }
details.group .items { padding-left: 14px; }
#varSearch { width: 100%; font: inherit; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface-1); color: var(--text-primary); }
.tabs { display: flex; gap: 2px; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--surface-1); overflow-x: auto; }
.tab { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 10px 14px; color: var(--text-secondary); white-space: nowrap; }
.tab[aria-selected=true] { color: var(--text-primary); border-bottom-color: var(--accent); font-weight: 600; }
main { min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 12px 20px; color: var(--text-secondary); }
.toolbar label { display: flex; gap: 6px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: none; border-radius: 0; padding: 4px 10px; }
.seg button[aria-pressed=true] { background: var(--accent); color: #fff; }
.panel { display: none; padding: 0 20px 24px; }
.panel.active { display: block; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
.card h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
.card .desc { color: var(--text-secondary); font-size: 12px; margin-bottom: 8px; max-width: 110ch; }
.empty { color: var(--text-muted); padding: 40px 20px; text-align: center; }
.plot { width: 100%; height: 320px; }
.status { font-size: 12px; color: var(--text-muted); }
/* findings */
.findings { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.findings li { display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: baseline; }
.pill { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.pill::before { margin-right: 4px; }
.pill.ok { color: var(--st-ok); } .pill.ok::before { content: "✓"; }
.pill.info { color: var(--st-info); } .pill.info::before { content: "ℹ"; }
.pill.warn { color: var(--st-warn); } .pill.warn::before { content: "▲"; }
.pill.bad { color: var(--st-bad); } .pill.bad::before { content: "✕"; }
/* tables */
.table-wrap { overflow-x: auto; max-height: 560px; overflow-y: auto; }
table.data { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; min-width: 100%; }
table.data th, table.data td { padding: 5px 10px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
table.data th:first-child, table.data td:first-child, table.data td.l, table.data th.l { text-align: left; }
table.data thead th { font-size: 12px; font-weight: 600; color: var(--text-secondary); position: sticky; top: 0;
  background: var(--surface-1); cursor: pointer; user-select: none; }
table.data thead th[data-sort]::after { content: " ↕"; color: var(--text-muted); }
table.data thead th.asc::after { content: " ↑"; color: var(--text-primary); }
table.data thead th.desc::after { content: " ↓"; color: var(--text-primary); }
table.data td.flag { color: var(--st-bad); font-weight: 600; }
table.data td.warnc { color: var(--st-warn); font-weight: 600; }
table.data td.best { font-weight: 700; }
table.data td.muted, .muted { color: var(--text-muted); }
table.data tr.sel td:first-child { font-weight: 700; }
/* maps */
.slider-row { display: flex; align-items: center; gap: 12px; padding: 4px 20px 12px; }
.slider-row input[type=range] { flex: 1; margin: 0; }
#frameLabel { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 48px; }
.map-row-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
.map-row-head h3 { margin: 0; font-size: 14px; }
.map-row-head .units { color: var(--text-secondary); font-size: 12px; }
.map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }
.map-cell .t { font-size: 12px; display: flex; justify-content: space-between; gap: 8px; margin-bottom: 3px; }
.map-cell .t .run { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.map-cell .t .stats { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.map-cell canvas { width: 100%; aspect-ratio: 2 / 1; display: block; border-radius: 4px; background: var(--missing); }
.colorbar { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.colorbar canvas { width: 160px; height: 10px; border-radius: 2px; }
.colorbar input { width: 90px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--text-secondary); margin-top: 8px; font-variant-numeric: tabular-nums; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--border); display: inline-block; }
.card-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.card-head h3 { flex: 1; }
.map-cell .t button { padding: 0 6px; font-size: 11px; }
#tooltip {
  position: fixed; pointer-events: none; z-index: 10; display: none;
  background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15);
  font-variant-numeric: tabular-nums;
}
.prose { max-width: 90ch; display: grid; gap: 10px; }
.prose p, .prose ul { margin: 0; }
.prose code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface-2); padding: 1px 4px; border-radius: 4px; }
@media (max-width: 800px) {
  .layout { grid-template-columns: 1fr; background: none; }
  aside { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--border); }
  header { flex-wrap: wrap; padding: 12px 16px; }
  .toolbar, .panel, .slider-row, .tabs { padding-left: 16px; padding-right: 16px; }
  .map-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <h1 id="title">Land data explorer</h1>
  <span class="sub" id="headerSub"></span>
  <span class="spacer"></span>
  <button id="themeBtn" title="Toggle light/dark">Theme</button>
</header>
<div class="layout">
  <aside>
    <h2>Sources <a id="srcAll">all</a></h2>
    <div id="srcList"></div>
    <h2>Difference baseline</h2>
    <select id="baselineSel" title="Source subtracted in 'Difference' views"></select>
    <h2>Variables <a id="varsNone">clear</a></h2>
    <input id="varSearch" type="search" placeholder="Filter variables…">
    <div id="varList"></div>
  </aside>
  <main>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="audit">Data audit</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="cov">Land coverage</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="ts">Land-mean time series</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="maps">Climatology maps</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="about">About</button>
    </nav>

    <section class="panel active" id="panel-audit">
      <div class="toolbar">
        <label><input type="checkbox" id="auditSelOnly"> Tables: only the selected variables</label>
        <span class="status" id="builtNote"></span>
      </div>
      <div id="auditBox"></div>
    </section>

    <section class="panel" id="panel-cov">
      <div class="toolbar">
        <label>Land map
          <span class="seg" id="covLandSeg">
            <button data-v="mask" aria-pressed="true">Land mask</button>
            <button data-v="frac" aria-pressed="false">landfrac</button>
          </span>
        </label>
        <label><input type="checkbox" id="covPerVar" checked> One map per variable</label>
        <label><input type="checkbox" id="covCoast" checked> Coastlines</label>
        <span style="flex:1"></span>
        <button id="covGapVars" title="Replace the sidebar selection with the variables that have gaps over land">Select variables with gaps</button>
      </div>
      <div id="covBox"></div>
    </section>

    <section class="panel" id="panel-ts">
      <div class="toolbar">
        <label>Averaging
          <span class="seg" id="avgSeg">
            <button data-v="monthly" aria-pressed="true">Monthly</button>
            <button data-v="running" aria-pressed="false">12-mo running</button>
            <button data-v="annual" aria-pressed="false">Annual</button>
          </span>
        </label>
        <label>Show
          <span class="seg" id="modeSeg">
            <button data-v="abs" aria-pressed="true">Value</button>
            <button data-v="diff" aria-pressed="false">Difference from baseline</button>
          </span>
        </label>
        <span style="flex:1"></span>
        <button id="csvBtn">Download CSV</button>
      </div>
      <div id="tsPlots"></div>
    </section>

    <section class="panel" id="panel-maps">
      <div class="toolbar">
        <label>Show
          <span class="seg" id="mapModeSeg">
            <button data-v="abs" aria-pressed="true">Climatology</button>
            <button data-v="diff" aria-pressed="false">Difference from baseline</button>
          </span>
        </label>
        <label>Speed
          <select id="speedSel"><option value="900">slow</option><option value="450" selected>medium</option><option value="150">fast</option></select>
        </label>
        <label><input type="checkbox" id="coastChk" checked> Coastlines</label>
        <span class="status" id="mapStatus"></span>
      </div>
      <div class="slider-row">
        <button id="playBtn" title="Play / pause">Play</button>
        <button id="prevBtn" title="Previous month">‹</button>
        <button id="nextBtn" title="Next month">›</button>
        <input type="range" id="monthSlider" min="0" max="11" value="0" aria-label="Month">
        <span id="frameLabel"></span>
      </div>
      <div id="mapRows" style="padding: 0 20px 24px"></div>
    </section>

    <section class="panel" id="panel-about">
      <div class="card prose" id="aboutBox"></div>
    </section>
  </main>
</div>
<div id="tooltip"></div>

<script>
// ---------------------------------------------------------------- data loading
// Data files are plain <script>s calling DASH.loaded(...) so the page works from file://
const DASH = {
  pending: {}, cache: {},
  loaded(kind, key, obj) {
    const id = kind + ':' + key;
    this.cache[id] = obj;
    (this.pending[id] || []).forEach(r => r(obj));
    delete this.pending[id];
  },
  load(kind, key, src) {
    const id = kind + ':' + key;
    if (this.cache[id]) return Promise.resolve(this.cache[id]);
    return new Promise((resolve, reject) => {
      const first = !this.pending[id];
      (this.pending[id] = this.pending[id] || []).push(resolve);
      if (!first) return;
      const s = document.createElement('script');
      s.src = src;
      s.onerror = () => { delete this.pending[id]; reject(new Error('missing ' + src)); };
      document.head.appendChild(s);
    });
  },
};
const enc = s => s.split('/').map(encodeURIComponent).join('/');
const loadTs = src => DASH.load('ts', src, enc(`data/ts/${src}.js`));
const loadMapRaw = (v, s) => DASH.load('map', `${v}/${s}`, enc(`data/maps/${v}/${s}.js`));
const decoded = {};
async function decodeField(obj) {  // uint16, 0 = missing, linear over [lo, hi]
  const bin = Uint8Array.from(atob(obj.data), c => c.charCodeAt(0));
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  const q = new Uint16Array(await new Response(stream).arrayBuffer());
  const out = new Float32Array(q.length), k = (obj.hi - obj.lo) / 65534;
  for (let i = 0; i < q.length; i++) out[i] = q[i] === 0 ? NaN : obj.lo + (q[i] - 1) * k;
  return out;
}
async function loadMap(v, s) {
  const key = v + '/' + s;
  if (!decoded[key]) decoded[key] = loadMapRaw(v, s).then(decodeField);
  return decoded[key];
}

// ---------------------------------------------------------------- state
const state = {
  sources: new Set(), baseline: null, vars: new Set(['TSA', 'H2OSOI_0', 'H2OSNO', 'EFLX_LH_TOT']),
  tab: 'audit', avg: 'monthly', mode: 'abs', mapMode: 'abs', month: 0, playing: null,
  ranges: {}, auditSelOnly: false, sorts: {}, covLand: 'mask',
};
let META, AUDIT, LAND = null;
const NY = 180, NX = 360;
const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const srcIds = () => META.sources.map(s => s.id);
const srcMeta = id => META.sources.find(s => s.id === id);
const srcColorVar = id => `--s${srcIds().indexOf(id) % 8 + 1}`;
const srcColor = id => css(srcColorVar(id));
const lineSwatch = colorVar =>
  `<svg class="lineswatch" width="24" height="8" aria-hidden="true"><line x1="1" y1="4" x2="23" y2="4"
    style="stroke:var(${colorVar})" stroke-width="2.2"/></svg>`;
const varMeta = v => META.vars.find(x => x.name === v);
const fmtUnits = u => (u || '').replace(/\^2/g, '²').replace(/\^3/g, '³').replace(/m2/g, 'm²').replace(/mm3/g, 'mm³');
const fmt = x => x == null || !isFinite(x) ? '–' :
  (x !== 0 && (Math.abs(x) >= 1e5 || Math.abs(x) < 1e-2)) ? x.toExponential(3) : +x.toPrecision(4) + '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const selectedSources = () => srcIds().filter(s => state.sources.has(s));
const selectedVars = () => META.vars.map(v => v.name).filter(v => state.vars.has(v));

// ---------------------------------------------------------------- sidebar
function buildSidebar() {
  const sl = document.getElementById('srcList');
  META.sources.forEach(s => {
    const lab = document.createElement('label');
    lab.className = 'check';
    lab.title = s.long_label + (s.path ? '\n' + s.path : '');
    lab.innerHTML = `<input type="checkbox" value="${esc(s.id)}" ${state.sources.has(s.id) ? 'checked' : ''}>
      ${lineSwatch(srcColorVar(s.id))}${esc(s.label)}<span class="meta">${esc(s.kind)}</span>`;
    lab.querySelector('input').onchange = e => { e.target.checked ? state.sources.add(s.id) : state.sources.delete(s.id); refresh(); };
    sl.appendChild(lab);
  });
  document.getElementById('srcAll').onclick = () => {
    const all = state.sources.size < META.sources.length;
    META.sources.forEach(s => all ? state.sources.add(s.id) : state.sources.delete(s.id));
    sl.querySelectorAll('input').forEach(i => i.checked = all);
    refresh();
  };
  const bs = document.getElementById('baselineSel');
  bs.innerHTML = META.sources.map(s => `<option value="${esc(s.id)}">${esc(s.long_label)}</option>`).join('');
  bs.value = state.baseline;
  bs.onchange = () => { state.baseline = bs.value; refresh(); };

  const vl = document.getElementById('varList');
  META.groups.forEach(g => {
    const members = META.vars.filter(v => v.group === g);
    if (!members.length) return;
    const d = document.createElement('details');
    d.className = 'group';
    d.open = members.some(v => state.vars.has(v.name));
    d.innerHTML = `<summary>${esc(g)} <span class="n">(${members.length})</span></summary><div class="items"></div>`;
    members.forEach(v => {
      const lab = document.createElement('label');
      lab.className = 'check';
      lab.dataset.search = (v.name + ' ' + v.long_name).toLowerCase();
      lab.title = `${v.long_name} [${fmtUnits(v.units)}] · ${v.cell_methods || 'static'} · proposed role: ${v.role}`;
      lab.innerHTML = `<input type="checkbox" value="${esc(v.name)}" ${state.vars.has(v.name) ? 'checked' : ''}>${esc(v.name)}<span class="meta">${esc(v.role)}</span>`;
      lab.querySelector('input').onchange = e => { e.target.checked ? state.vars.add(v.name) : state.vars.delete(v.name); refresh(); };
      d.querySelector('.items').appendChild(lab);
    });
    vl.appendChild(d);
  });
  document.getElementById('varSearch').oninput = e => {
    const q = e.target.value.toLowerCase();
    vl.querySelectorAll('details').forEach(d => {
      let any = false;
      d.querySelectorAll('label').forEach(l => { const m = !q || l.dataset.search.includes(q); l.style.display = m ? '' : 'none'; any = any || m; });
      d.style.display = any ? '' : 'none';
      if (q) d.open = any;
    });
  };
  document.getElementById('varsNone').onclick = () => {
    state.vars.clear(); vl.querySelectorAll('input').forEach(i => i.checked = false); refresh();
  };
}

// ---------------------------------------------------------------- tables
// cols: [{key, label, fmt?(v,row), cls?(v,row), left?}]
function tableHtml(id, cols, rows) {
  const sort = state.sorts[id];
  if (sort) {
    const { key, dir } = sort;
    rows = [...rows].sort((a, b) => {
      const x = a[key], y = b[key];
      if (x == null) return 1; if (y == null) return -1;
      return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y))) * dir;
    });
  }
  const head = cols.map(c => `<th data-sort="${c.key}" data-table="${id}" class="${c.left ? 'l ' : ''}${sort && sort.key === c.key ? (sort.dir > 0 ? 'asc' : 'desc') : ''}"
    title="${esc(c.title || '')}">${esc(c.label)}</th>`).join('');
  const body = rows.map(r => `<tr class="${state.vars.has(r.var) ? 'sel' : ''}">` + cols.map(c => {
    const v = r[c.key];
    const cls = (c.left ? 'l ' : '') + (c.cls ? c.cls(v, r) || '' : '');
    return `<td class="${cls}">${c.fmt ? c.fmt(v, r) : esc(v ?? '–')}</td>`;
  }).join('') + '</tr>').join('');
  return `<div class="table-wrap"><table class="data"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
document.addEventListener('click', e => {
  const th = e.target.closest('th[data-sort]');
  if (!th) return;
  const id = th.dataset.table, key = th.dataset.sort, cur = state.sorts[id];
  state.sorts[id] = { key, dir: cur && cur.key === key ? -cur.dir : (key === 'var' ? 1 : -1) };
  renderAudit();
});

let A_MASKS = { gap_vars: {} }, MASK_FIELDS = null;
async function drawMasks() {
  if (!MASK_FIELDS) {
    const m = await DASH.load('masks', 'null', 'data/masks.js');
    A_MASKS = m;
    MASK_FIELDS = { lf: await decodeField(m.landfrac), gap: (await decodeField(m.gap_count)).map(Math.round) };
    renderAudit();
    return;
  }
  await ensureLand();
  const seq = seqLut();
  const nVars = META.vars.length - 1;
  paintField(document.getElementById('lfCanvas'), MASK_FIELDS.lf, 0, x => seq(x));
  const gmax = Math.max(1, ...MASK_FIELDS.gap.filter(isFinite));
  paintField(document.getElementById('gapCanvas'), MASK_FIELDS.gap, 0, x => x === 0 ? hexToRgb(css('--div-mid')) : seq(x / gmax));
  colorbarHtml(document.getElementById('lfBar'), seq, '0', '1');
  colorbarHtml(document.getElementById('gapBar'), t => seq(t), '0', String(gmax));
  document.getElementById('gapStats').textContent = `${cnt(MASK_FIELDS.gap.filter(x => x > 0).length)} land cells with gaps · max ${gmax} of ${nVars}`;
  document.getElementById('lfStats').textContent = `${cnt(META.land_cells)} land cells`;
}

// ---------------------------------------------------------------- time series
const DAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
const monthX = i => +META.months[i].slice(0, 4) + (i % 12 + 0.5) / 12;  // model year, fractional
function aggregate(y) {
  const n = y.length;
  const x = y.map((_, i) => monthX(i));
  if (state.avg === 'monthly') return { x, y };
  if (state.avg === 'annual') {
    const xs = [], ys = [];
    for (let i = 0; i + 12 <= n; i += 12) {
      let s = 0, w = 0;
      for (let k = 0; k < 12; k++) if (y[i + k] != null) { s += y[i + k] * DAYS[k]; w += DAYS[k]; }
      xs.push(+META.months[i].slice(0, 4) + 0.5);
      ys.push(w === 365 ? s / w : null);
    }
    return { x: xs, y: ys };
  }
  const ys = new Array(n).fill(null);  // centered 12-month running mean
  for (let i = 6; i + 6 <= n; i++) {
    let s = 0, w = 0, ok = true;
    for (let k = i - 6; k < i + 6; k++) { if (y[k] == null) { ok = false; break; } s += y[k] * DAYS[k % 12]; w += DAYS[k % 12]; }
    ys[i] = ok ? s / w : null;
  }
  return { x, y: ys };
}

// ---------------------------------------------------------------- color
function hexToRgb(h) { h = h.replace('#', ''); return [0, 2, 4].map(k => parseInt(h.slice(k, k + 2), 16)); }
function seqLut() {  // t in [0, 1] -> rgb, one hue light to dark (dark theme: dark to light)
  const stops = [0, 1, 2, 3, 4].map(i => hexToRgb(css(`--seq-${i}`)));
  const lut = [];
  for (let i = 0; i < 256; i++) {
    const t = i / 255 * 4, k = Math.min(3, Math.floor(t)), f = t - k;
    lut.push(stops[k].map((a, j) => Math.round(a + (stops[k + 1][j] - a) * f)));
  }
  return t => lut[Math.max(0, Math.min(255, Math.round(t * 255)))];
}
function divLut() {  // t in [-1, 1] -> rgb, two hues around a neutral midpoint
  const neg = hexToRgb(css('--div-neg')), mid = hexToRgb(css('--div-mid')), pos = hexToRgb(css('--div-pos'));
  const lut = [];
  for (let i = 0; i < 256; i++) {
    const t = i / 127.5 - 1, a = Math.min(1, Math.abs(t)), end = t < 0 ? neg : pos;
    lut.push(mid.map((m, k) => Math.round(m + (end[k] - m) * a)));
  }
  return t => lut[Math.max(0, Math.min(255, Math.round((t + 1) * 127.5)))];
}
function colorbarHtml(el, lut, lo, hi, signed = false) {
  el.innerHTML = `<span>${esc(lo)}</span><canvas width="160" height="10"></canvas><span>${esc(hi)}</span>`;
  const ctx = el.querySelector('canvas').getContext('2d');
  for (let x = 0; x < 160; x++) { const t = signed ? x / 79.5 - 1 : x / 159; ctx.fillStyle = `rgb(${lut(t)})`; ctx.fillRect(x, 0, 1, 10); }
}

// ---------------------------------------------------------------- maps
async function ensureLand() {
  if (LAND !== null) return;
  LAND = false;
  // lib/land-110m.js works from file:// (fetch does not); the CDN is a fallback when it is absent
  const sources = [() => DASH.load('land', 'null', 'lib/land-110m.js'),
    () => fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json').then(r => r.json())];
  for (const get of sources) {
    try {
      const topo = await get();
      LAND = topojson.feature(topo, topo.objects.land);
      return;
    } catch (e) { /* try next */ }
  }
}
// fractional row index of a latitude on the (slightly irregular) data grid
function latRow(lat) {
  const L = META.lat, n = L.length;
  if (lat <= L[0]) return (lat - L[0]) / (L[1] - L[0]);
  if (lat >= L[n - 1]) return n - 1 + (lat - L[n - 1]) / (L[n - 1] - L[n - 2]);
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (L[m] <= lat) lo = m; else hi = m; }
  return lo + (lat - L[lo]) / (L[hi] - L[lo]);
}
function drawCoast(ctx, W, H, show = document.getElementById('coastChk').checked) {
  if (!LAND || !show) return;
  ctx.strokeStyle = css('--coast'); ctx.lineWidth = 0.8 * Math.max(1, W / 720);
  ctx.beginPath();
  const proj = ([lon, lat]) => [(lon + 180) / 360 * W, (NY - 0.5 - latRow(lat)) / NY * H];
  const ring = r => { let prev = null; r.forEach((p, i) => { const q = proj(p);
      if (i === 0 || (prev && Math.abs(q[0] - prev[0]) > W / 2)) ctx.moveTo(...q); else ctx.lineTo(...q); prev = q; }); };
  LAND.features.forEach(f => {
    const g = f.geometry;
    (g.type === 'Polygon' ? [g.coordinates] : g.coordinates).forEach(p => p.forEach(ring));
  });
  ctx.stroke();
}
// paint frame `frame` of a flat [frame][lat][lon] field; colorOf(value) -> rgb. Returns land-cell stats.
function paintField(canvas, field, frame, colorOf, coast) {
  const small = document.createElement('canvas'); small.width = NX; small.height = NY;
  const sctx = small.getContext('2d'), img = sctx.createImageData(NX, NY);
  const miss = hexToRgb(css('--missing')), off = frame * NY * NX;
  let s = 0, n = 0;
  for (let row = 0; row < NY; row++) {
    const srcRow = NY - 1 - row;  // north up
    for (let col = 0; col < NX; col++) {
      const srcCol = (col + NX / 2) % NX;  // data lon 0..360 -> display -180..180
      const v = field[off + srcRow * NX + srcCol];
      const c = isNaN(v) ? miss : colorOf(v);
      if (!isNaN(v)) { s += v; n++; }
      const p = (row * NX + col) * 4;
      img.data[p] = c[0]; img.data[p + 1] = c[1]; img.data[p + 2] = c[2]; img.data[p + 3] = 255;
    }
  }
  sctx.putImageData(img, 0, 0);
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(small, 0, 0, canvas.width, canvas.height);
  drawCoast(ctx, canvas.width, canvas.height, coast);
  return { mean: n ? s / n : NaN, n };
}

function valueRange(v) {
  const vm = varMeta(v);
  return state.ranges[v + ':abs'] || [vm.p01, vm.p99];
}
function diffRange(v) { return state.ranges[v + ':diff'] || [Math.abs(varMeta(v).diff_p99) || 1]; }
const mapCells = {};  // `${var}/${source}` -> {canvas, stats, field, base}
function renderMapFrame() {
  const m = state.month;
  document.getElementById('monthSlider').value = m;
  document.getElementById('frameLabel').textContent = MONTH_NAMES[m];
  const seq = seqLut(), div = divLut();
  Object.entries(mapCells).forEach(([key, cell]) => {
    if (!cell.field) return;
    const v = key.split('/')[0];
    let st;
    if (state.mapMode === 'diff') {
      const [R] = diffRange(v), f = cell.field, b = cell.base, off = m * NY * NX;
      const d = new Float32Array(NY * NX);
      for (let i = 0; i < d.length; i++) d[i] = f[off + i] - b[off + i];
      st = paintField(cell.canvas, d, 0, x => div(x / R));
    } else {
      const [lo, hi] = valueRange(v);
      st = paintField(cell.canvas, cell.field, m, x => seq((x - lo) / (hi - lo || 1)));
    }
    cell.stats.textContent = st.n ? `cell mean ${fmt(st.mean)}` : 'no data';
  });
}

const tooltip = document.getElementById('tooltip');
function hoverMap(e, key, v, s) {

// ---------------------------------------------------------------- land coverage
// Which land cells each variable is missing at (in any record of either case), against the land mask.
let COV = null;  // {lf, w: cell area x landfrac (0 off land), landArea, landCells, gaps: {var: Uint8Array}}
async function loadCoverage() {
  if (COV) return COV;
  const m = await DASH.load('masks', 'null', 'data/masks.js');
  const lf = await decodeField(m.landfrac);
  const L = META.lat, edges = [-90, ...L.slice(1).map((x, j) => (x + L[j]) / 2), 90];
  const rowW = L.map((_, j) => Math.sin(edges[j + 1] * Math.PI / 180) - Math.sin(edges[j] * Math.PI / 180));
  const w = new Float64Array(NY * NX);
  let landArea = 0, landCells = 0;
  for (let i = 0; i < w.length; i++) {
    if (isNaN(lf[i])) continue;
    w[i] = rowW[Math.floor(i / NX)] * lf[i]; landArea += w[i]; landCells++;
  }
  const gaps = {};
  Object.entries(m.gap_bits || {}).forEach(([v, b64]) => {
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0)), g = new Uint8Array(NY * NX);
    for (let i = 0; i < g.length; i++) g[i] = (bytes[i >> 3] >> (7 - (i & 7))) & 1;  // np.packbits is big-endian
    gaps[v] = g;
  });
  COV = { lf, w, landArea, landCells, gaps, hasBits: !!m.gap_bits };
  return COV;
}
// per-cell class: 0 not land, 1 land with data in every selected variable, 2 missing in some, 3 missing in all
function covClasses(vars) {
  const out = new Float32Array(NY * NX), gs = vars.map(v => COV.gaps[v]).filter(Boolean);
  for (let i = 0; i < out.length; i++) {
    if (isNaN(COV.lf[i])) continue;
    let k = 0;
    for (const g of gs) k += g[i];
    out[i] = k === 0 ? 1 : k === vars.length ? 3 : 2;
  }
  return out;
}
function covTally(cls) {  // class -> {cells, area as a fraction of land area}
  const t = [0, 1, 2, 3].map(() => ({ cells: 0, area: 0 }));
  for (let i = 0; i < cls.length; i++) { t[cls[i]].cells++; t[cls[i]].area += COV.w[i]; }
  t.forEach(x => x.area /= COV.landArea);
  return t;
}
const COV_COLORS = ['--cov-ocean', '--cov-land', '--cov-some', '--cov-all'];
const covRgb = () => COV_COLORS.map(c => hexToRgb(css(c)));
function covLegend(tally, n) {  // [{color, label}] for the classes that can occur with n variables
  const share = k => k ? ` · ${cnt(tally[k].cells)} cells, ${pct(tally[k].area)} of land area` : '';
  return [
    { color: '--cov-ocean', label: 'not land (landfrac = 0)' },
    { color: '--cov-land', label: (n > 1 ? 'land, data in all' : 'land, data present') + share(1) },
    ...(n > 1 ? [{ color: '--cov-some', label: 'land, missing in some' + share(2) }] : []),
    { color: '--cov-all', label: (n > 1 ? 'land, missing in all' : 'land, missing') + share(3) },
  ];
}
const legendHtml = items => `<div class="legend">${items.map(it => it.ramp
  ? `<span>${esc(it.lo)}<canvas width="120" height="10" data-ramp="1" style="width:120px;height:10px;border-radius:2px"></canvas>${esc(it.hi)} ${esc(it.label)}</span>`
  : `<span><i style="background:var(${it.color})"></i>${esc(it.label)}</span>`).join('')}</div>`;
function paintRamps(el, lut) {
  el.querySelectorAll('canvas[data-ramp]').forEach(c => {
    const ctx = c.getContext('2d');
    for (let x = 0; x < c.width; x++) { ctx.fillStyle = `rgb(${lut(x / (c.width - 1))})`; ctx.fillRect(x, 0, 1, c.height); }
  });
}
function selectGapVars() {
  state.vars = new Set(Object.keys((COV && COV.gaps) || {}));
  document.querySelectorAll('#varList input').forEach(i => i.checked = state.vars.has(i.value));
  document.querySelectorAll('#varList details').forEach(d => { if (d.querySelector('input:checked')) d.open = true; });
  refresh();
}

// figure export: panels [{label, paint(canvas)}] in a grid, title above, legend below, current theme colors
function exportFigure(file, title, sub, panels, legend, cols) {
  const PW = 1080, PH = 540, pad = 28, gap = 18, labH = 32, sw = 20;
  const font = (wt, px) => `${wt} ${px}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
  cols = Math.max(1, Math.min(cols, panels.length));
  const rows = Math.ceil(panels.length / cols), W = pad * 2 + cols * PW + (cols - 1) * gap;
  // lay out the legend first so the canvas height is known
  const meas = document.createElement('canvas').getContext('2d');
  meas.font = font(400, 19);
  const legPos = [];
  let lx = pad, lrow = 0;
  legend.forEach(it => {
    const iw = it.ramp ? meas.measureText(`${it.lo} ${it.hi} ${it.label}`).width + 200 + 24 : sw + 10 + meas.measureText(it.label).width;
    if (lx > pad && lx + iw > W - pad) { lx = pad; lrow++; }
    legPos.push([lx, lrow]); lx += iw + 32;
  });
  const titleH = sub ? 78 : 46, legH = legend.length ? (lrow + 1) * 32 + 10 : 0;
  const c = document.createElement('canvas');
  c.width = W; c.height = pad * 2 + titleH + rows * (labH + PH) + (rows - 1) * gap + legH;
  const ctx = c.getContext('2d');
  ctx.fillStyle = css('--surface-1'); ctx.fillRect(0, 0, c.width, c.height);
  ctx.textBaseline = 'top';
  ctx.fillStyle = css('--text-primary'); ctx.font = font(600, 28); ctx.fillText(title, pad, pad);
  if (sub) { ctx.fillStyle = css('--text-secondary'); ctx.font = font(400, 19); ctx.fillText(sub, pad, pad + 40); }
  panels.forEach((p, k) => {
    const x = pad + (k % cols) * (PW + gap), y = pad + titleH + Math.floor(k / cols) * (labH + PH + gap);
    ctx.fillStyle = css('--text-primary'); ctx.font = font(600, 21); ctx.fillText(p.label, x, y + 2);
    const m = document.createElement('canvas'); m.width = PW; m.height = PH;
    p.paint(m);
    ctx.drawImage(m, x, y + labH);
  });
  const ly0 = c.height - pad - legH + 10;
  ctx.font = font(400, 19);
  legend.forEach((it, k) => {
    const [x, r] = legPos[k], y = ly0 + r * 32;
    ctx.fillStyle = css('--text-secondary');
    if (it.ramp) {
      ctx.fillText(it.lo, x, y + 1);
      const rx = x + meas.measureText(it.lo).width + 8;
      for (let j = 0; j < 200; j++) { ctx.fillStyle = `rgb(${it.ramp(j / 199)})`; ctx.fillRect(rx + j, y + 4, 1, 14); }
      ctx.fillStyle = css('--text-secondary');
      ctx.fillText(`${it.hi} ${it.label}`, rx + 208, y + 1);
      return;
    }
    ctx.fillStyle = css(it.color); ctx.fillRect(x, y, sw, sw);
    ctx.strokeStyle = css('--border'); ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, sw - 1, sw - 1);
    ctx.fillStyle = css('--text-secondary'); ctx.fillText(it.label, x + sw + 10, y + 1);
  });
  c.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = file; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
}

function covHover(canvas, text) {  // text(i) -> html for grid index i
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const col = Math.floor((e.clientX - rect.left) / rect.width * NX), row = Math.floor((e.clientY - rect.top) / rect.height * NY);
    if (col < 0 || col >= NX || row < 0 || row >= NY) return;
    const srcRow = NY - 1 - row, i = srcRow * NX + (col + NX / 2) % NX;
    tooltip.innerHTML = `${META.lat[srcRow].toFixed(2)}°, ${(col - 179.5).toFixed(1)}°<br>${text(i)}`;
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top = (e.clientY + 14) + 'px';
  });
  canvas.addEventListener('mouseleave', () => tooltip.style.display = 'none');
}
async function renderCov() {
  const box = document.getElementById('covBox');
  try { await loadCoverage(); } catch (e) { box.innerHTML = `<div class="empty">No data/masks.js (${esc(e.message)}).</div>`; return; }
  if (!COV.hasBits) {
    box.innerHTML = `<div class="empty">This build has no per-variable gap masks. Rerun <code>audit/prep.py build</code>.</div>`;
    return;
  }
  await ensureLand();
  const coast = document.getElementById('covCoast').checked, perVar = document.getElementById('covPerVar').checked;
  const vars = selectedVars().filter(v => varMeta(v).role !== 'static');
  const rgb = covRgb(), seq = seqLut();
  const lfText = i => isNaN(COV.lf[i]) ? 'not land' : `landfrac ${COV.lf[i].toFixed(3)}`;
  const missText = i => {
    if (isNaN(COV.lf[i])) return '';
    const m = vars.filter(v => COV.gaps[v] && COV.gaps[v][i]);
    return '<br>' + (m.length ? `missing: <b>${m.map(esc).join(', ')}</b>` : 'data in all selected');
  };
  const frac = state.covLand === 'frac';
  const landLegend = frac
    ? [{ color: '--cov-ocean', label: 'landfrac = 0' }, { ramp: seq, lo: '0', hi: '1', label: 'landfrac' }]
    : [{ color: '--cov-ocean', label: 'not land (landfrac = 0)' }, { color: '--cov-land', label: `land · ${cnt(COV.landCells)} cells` }];
  // paintField greys NaN; here off-land is its own class, so mark it -1
  const landField = COV.lf.map(x => isNaN(x) ? -1 : x);
  const landPanel = {
    label: frac ? 'landfrac' : 'Land mask (landfrac > 0)',
    paint: cv => paintField(cv, landField, 0, x => x < 0 ? rgb[0] : frac ? seq(x) : rgb[1], coast),
  };

  const cls = vars.length ? covClasses(vars) : null, tally = cls && covTally(cls);
  const covPanel = cls && {
    label: vars.length === 1 ? `${vars[0]} coverage` : `Coverage of ${vars.length} selected variables`,
    paint: cv => paintField(cv, cls, 0, k => rgb[k], coast),
  };
  const covLeg = cls ? covLegend(tally, vars.length) : [];
  const sub = 'E3SMv3 F2010 elm.h0, 180×360 · missing = |x| ≥ 1e19 in any 6-hourly record, years 1–30, PD or PI';

  const summary = !cls ? 'Select variables in the sidebar to map where they are missing over land.'
    : tally[2].cells + tally[3].cells === 0 ? `None of the selected variables is missing over land.`
    : `${cnt(tally[2].cells + tally[3].cells)} of ${cnt(COV.landCells)} land cells (${pct(tally[2].area + tally[3].area)} of land area)
       lack data in at least one selected variable${vars.length > 1 ? `; ${cnt(tally[3].cells)} lack it in all` : ''}.`;
  const cellHtml = (id, label, stats) => `<div class="map-cell"><div class="t"><span class="run">${esc(label)}</span>
    <span class="stats">${stats} <button data-png="${id}" title="Save this map as PNG">PNG</button></span></div>
    <canvas id="${id}" width="720" height="360"></canvas></div>`;
  let html = `<div class="card"><div class="card-head"><h3>Land mask and coverage of the selected variables</h3>
      <button id="covFigBtn">Save figure (PNG)</button></div>
    <div class="desc">Left: the land cells (landfrac &gt; 0). Right: the same cells coloured by whether the selected variables have data.
      Gaps are the same cells in every record. ${summary}</div>
    <div class="map-grid">${cellHtml('covLand', landPanel.label, `${cnt(COV.landCells)} land cells`)}
      ${cls ? cellHtml('covMap', covPanel.label, '') : '<div class="map-cell"><div class="empty">No variables selected.</div></div>'}</div>
    ${legendHtml([...landLegend, ...covLeg.slice(1)])}</div>`;

  const rows = vars.map(v => {
    const g = COV.gaps[v];
    let cells = 0, area = 0;
    if (g) for (let i = 0; i < g.length; i++) if (g[i]) { cells++; area += COV.w[i]; }
    return { var: v, long_name: varMeta(v).long_name, cells, frac_cells: cells / COV.landCells, frac_area: area / COV.landArea };
  });
  const perVarLeg = [{ color: '--cov-ocean', label: 'not land' }, { color: '--cov-land', label: 'data present' }, { color: '--cov-all', label: 'missing' }];
  if (perVar && vars.length) {
    html += `<div class="card"><div class="card-head"><h3>Coverage per variable</h3><button id="covVarsBtn">Save figure (PNG)</button></div>
      <div class="desc">One map per selected variable: land cells with data, and land cells where it is missing.</div>
      <div class="map-grid">${rows.map(r => cellHtml('cov_' + r.var, r.var, r.cells ? `${cnt(r.cells)} cells · ${pct(r.frac_area)} of land area` : 'no gaps')).join('')}</div>
      ${legendHtml(perVarLeg)}</div>`;
  }
  if (vars.length) {
    html += `<div class="card"><h3>Missing land cells by variable</h3>
      <div class="desc">Land cells (landfrac &gt; 0) where the variable is missing in any record. Area shares weight each cell by its area × landfrac.</div>
      ${tableHtml('cov', [
        { key: 'var', label: 'variable', left: true }, { key: 'long_name', label: 'long name', left: true },
        { key: 'cells', label: 'land cells missing', fmt: cnt, cls: v => v ? 'warnc' : '' },
        { key: 'frac_cells', label: 'of land cells', fmt: pct }, { key: 'frac_area', label: 'of land area', fmt: pct },
      ], rows)}</div>`;
  }
  box.innerHTML = html;
  paintRamps(box, seq);

  // paint, hover and export
  const panels = { covLand: landPanel };
  if (cls) panels.covMap = covPanel;
  rows.forEach(r => {
    const g = COV.gaps[r.var], f = new Float32Array(NY * NX);
    for (let i = 0; i < f.length; i++) f[i] = isNaN(COV.lf[i]) ? 0 : g && g[i] ? 3 : 1;
    panels['cov_' + r.var] = { label: `${r.var}${r.cells ? ` · ${cnt(r.cells)} land cells missing` : ' · no gaps'}`, paint: cv => paintField(cv, f, 0, k => rgb[k], coast) };
  });
  Object.entries(panels).forEach(([id, p]) => {

  });

    rows.map(r => panels['cov_' + r.var]), perVarLeg, Math.min(3, rows.length));
}

function segControl(id, key, after = refresh) {
  document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => {
    state[key] = b.dataset.v;
    document.querySelectorAll(`#${id} button`).forEach(x => x.setAttribute('aria-pressed', x === b));
    after();
  });
}
function setupTabs() {
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    state.tab = t.dataset.tab;
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === t));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + state.tab));
    refresh();
  });
}
function showError(e) {
  document.getElementById('auditBox').innerHTML = `<div class="empty">Could not load the dashboard data (${esc(e.message)}).
    Build it with <code>audit/prep.py build</code>.</div>`;
}
document.getElementById('themeBtn').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  refresh();
};
Promise.all([DASH.load('meta', 'null', 'data/meta.js'), DASH.load('audit', 'null', 'data/audit.js')]).then(([meta, audit]) => {
  META = meta; AUDIT = audit;
  document.getElementById('title').textContent = META.title + ' explorer';
  document.getElementById('headerSub').textContent = META.sources.map(s => s.label).join(' and ') + ' · elm.h0, 180×360, 6-hourly, years 1–30';
  document.getElementById('builtNote').textContent = 'built ' + META.built;
  META.sources.forEach(s => state.sources.add(s.id));
  state.baseline = (META.sources.find(s => s.id === 'PI') || META.sources[0]).id;
  [...state.vars].forEach(v => { if (!varMeta(v)) state.vars.delete(v); });
  buildSidebar();
  setupTabs();
  segControl('avgSeg', 'avg');
  segControl('modeSeg', 'mode');
  segControl('mapModeSeg', 'mapMode');
  segControl('covLandSeg', 'covLand');
  document.getElementById('covPerVar').onchange = refresh;
  document.getElementById('covCoast').onchange = refresh;
  document.getElementById('covGapVars').onclick = selectGapVars;
  setupMapControls();
  document.getElementById('csvBtn').onclick = downloadCsv;
  document.getElementById('auditSelOnly').onchange = e => { state.auditSelOnly = e.target.checked; renderAudit(); };
  renderAbout();
  refresh();
}).catch(showError);
</script>
</body>
</html>
